# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    outputs:
      dotnet-version: ${{ steps.setup-dotnet.outputs.dotnet-version }}

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      id: setup-dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Create staging directory
      run: mkdir -p ./staging
    - name: Build
      run: dotnet build --output ./staging --no-restore
    - name: Run offline tests
      run: dotnet test UnitTests/UnitTests.csproj --output ./staging --no-build --filter 'TestCategory=Offline' -- RunConfiguration.TreatNoTestsAsError=true
    - name: list .exe artifacts
      run: find staging -name \*.exe
    - name: list .dll artifacts
      run: find staging -name \*.dll
    - name: Grab distribution files
      working-directory: staging
      run: |
       mkdir -p ../dist
       mv *.dll *.pdb ../dist/
    - name: Upload dist artifact
      uses: actions/upload-artifact@v4
      id: artifact-upload
      with:
        name: dist
        path: dist
        if-no-files-found: error

  live-tests:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: OSSBUILD

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ needs.build.outputs.dotnet-version }}
    - name: Run live IBM i tests
      if: env.MAPEPIRE_HOST != '' && env.MAPEPIRE_PORT != '' && env.MAPEPIRE_USER != '' && env.MAPEPIRE_PASSWORD != ''
      run: dotnet test UnitTests/UnitTests.csproj --filter 'TestCategory!=Offline' -- RunConfiguration.TreatNoTestsAsError=true
      env:
        MAPEPIRE_HOST: ${{ secrets.MAPEPIRE_HOST }}
        MAPEPIRE_PORT: ${{ secrets.MAPEPIRE_PORT }}
        MAPEPIRE_USER: ${{ secrets.MAPEPIRE_USER }}
        MAPEPIRE_PASSWORD: ${{ secrets.MAPEPIRE_PASSWORD }}
